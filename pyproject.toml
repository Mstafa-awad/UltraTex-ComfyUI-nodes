[project]
name = "comfyui-ultratex-modular"
version = "2.3.16rc1"
description = "Modular foreground-only UltraTex generation, tiled UV baking, and native ComfyUI materials"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = ["numpy>=1.26", "Pillow>=10.0", "scipy>=1.11", "einops>=0.7", "moderngl>=5.10", "glcontext>=3.0", "psutil>=5.9", "trimesh>=4.0", "threadpoolctl>=3.6"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
